# Vérification complète sur les machines de GitHub pour les branches de travail des agents et d'intégration.
# Ne publie rien : la publication reste faite par pages.yml sur main.
name: Verification

on:
  push:
    branches: ["agent/**", "integration/**", "base/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  donnees:
    name: Donnees (pytest, contrat)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Dependances figees (empreintes verifiees)
        run: pip install --require-hashes --no-deps -r requirements.lock
      - name: Tests
        run: python -m pytest -q
      - name: Contrat d'interface (strict)
        run: python docs/valider_contrat.py --strict

  site:
    name: Site (tests, build, prerendu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
