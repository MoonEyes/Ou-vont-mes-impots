name: Mise a jour des donnees

# Regenere tout site/data chaque semaine, sans intervention (pipeline/tout.py : ordre des dependances, reprise,
# sources inaccessibles notees dans site/data/mise_a_jour.json sans faire echouer la semaine).
# Pattern "git scraping" en deux jobs (docs/AUDIT_SECURITE.md, constat I2) :
#   produire : lecture seule, sans jeton d'ecriture ; execute le code sur les donnees externes, valide
#              (Frictionless, contrat --strict, pytest complet) puis livre un correctif de donnees en artifact ;
#   publier  : seul a pouvoir ecrire ; n'execute aucun code du pipeline, verifie que le correctif ne touche que
#              data/raw, data/processed, site/data et docs/datapackage, puis committe et pousse.
# Pas de commit si seuls genere_le (meta.json) ou le rapport de passage (mise_a_jour.json) changent.
# Le workflow "Site (GitHub Pages)" (pages.yml) se declenche apres celui-ci (workflow_run).
on:
  schedule:
    - cron: "17 4 * * 1"   # chaque lundi 04:17 UTC
  workflow_dispatch:
    inputs:
      etapes:
        description: "Etapes (ex. secu,dette) ; vide = toutes"
        required: false
        default: ""
      rafraichir:
        description: "Relire l'amont de toutes les sources de l'entrepot (sinon : sources manquantes seulement)"
        type: boolean
        default: false
      reconstruction:
        description: "Reconstruction complete : recollecter toutes les sources, regenerer tous les axes ; ne publie rien si un axe reste incomplet"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: data
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  produire:
    runs-on: ubuntu-latest
    timeout-minutes: 345   # limite GitHub : 360 min par job ; pipeline/tout.py s'arrete a 270 min (--budget)
    permissions:
      contents: read
    outputs:
      tests: ${{ steps.tests.outputs.resultat }}
      publiable: ${{ steps.correctif.outputs.publiable }}
      complet: ${{ steps.complet.outputs.complet }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # aucun jeton dans .git/config pendant l'execution du pipeline

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Outils systeme (PDF, OCR)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-fra

      - name: Dependances figees (empreintes verifiees)
        run: pip install --require-hashes --no-deps -r requirements.lock

      # Entrepot data/lake : sous-ensemble lu par les etapes (pipeline/entrees_lac.json) et caches des modules
      # (resolutions SIREN, pages ccomptes.fr, extraits OFGL, OCR...). La zone _restreint (personnes physiques)
      # n'entre jamais dans le cache GitHub : un cache de depot public est lisible par un workflow de fork.
      - name: Restaurer l'entrepot (cache)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/lake
            !data/lake/_restreint
          key: lac-v1-${{ github.run_id }}
          restore-keys: lac-v1-

      # Source durable de l'entrepot : le bucket PUBLIC OVH (docs/STOCKAGE.md, prefixe _entrees/ rempli par le VPS),
      # en lecture seule (GET), objets verifies par sha256 ; le cache GitHub ci-dessus n'est qu'un accelerateur.
      # Sans configuration (variables du depot vides), l'etape ne fait rien. Lecture anonyme si le bucket est ouvert
      # en lecture ; sinon cle S3 en lecture seule dans les secrets OVMI_S3_LECTURE_ID / OVMI_S3_LECTURE_SECRET.
      # La zone _restreint n'est jamais lue : refusee par pipeline/entrepot_distant.py, absente de l'index public.
      - name: Restaurer l'entrepot depuis le bucket public (lecture seule)
        env:
          ETAPES: ${{ inputs.etapes }}
          OVMI_LAC_URL: ${{ vars.OVMI_LAC_URL }}
          OVMI_LAC_ENDPOINT: ${{ vars.OVMI_LAC_ENDPOINT }}
          OVMI_LAC_REGION: ${{ vars.OVMI_LAC_REGION }}
          OVMI_LAC_BUCKET: ${{ vars.OVMI_LAC_BUCKET }}
          OVMI_S3_LECTURE_ID: ${{ secrets.OVMI_S3_LECTURE_ID }}
          OVMI_S3_LECTURE_SECRET: ${{ secrets.OVMI_S3_LECTURE_SECRET }}
        run: python pipeline/entrepot_distant.py restaurer ${ETAPES:+--etapes "$ETAPES"}

      - name: Completer l'entrepot (sources du catalogue lues par les etapes)
        env:
          RAFRAICHIR: ${{ inputs.rafraichir }}
          RECONSTRUCTION: ${{ inputs.reconstruction }}
          ETAPES: ${{ inputs.etapes }}
        run: |
          # premier lundi du mois, reconstruction ou demande explicite : relecture de l'amont (requetes
          # conditionnelles) ; sinon seulement les sources absentes du bucket et du cache.
          opt=""
          if [ "${RAFRAICHIR:-false}" = "true" ] || [ "${RECONSTRUCTION:-false}" = "true" ] || [ "$(date -u +%d)" -le 7 ]; then opt="--rafraichir"; fi
          python pipeline/tout.py entrepot $opt ${ETAPES:+--etapes "$ETAPES"} --budget 3600

      - name: Regenerer site/data (pipeline/tout.py)
        id: orchestrateur
        env:
          ETAPES: ${{ inputs.etapes }}
        run: |
          set +e
          python pipeline/tout.py ${ETAPES:+--etapes "$ETAPES"} --budget 16200
          echo "code=$?" >> "$GITHUB_OUTPUT"

      # Reconstruction complete : chaque axe doit etre « produit » ; un axe conserve, partiel, reporte ou en echec
      # bloque la publication (job publier saute). Les axes dont une entree est en zone restreinte sont comptes a
      # part (regeneres sur le VPS seulement).
      - name: Reconstruction complete (tous les axes produits ?)
        id: complet
        if: always() && steps.orchestrateur.outcome != 'skipped'
        env:
          RECONSTRUCTION: ${{ inputs.reconstruction }}
        run: |
          if [ "${RECONSTRUCTION:-false}" != "true" ]; then echo "complet=sans_objet" >> "$GITHUB_OUTPUT"; exit 0; fi
          if python pipeline/entrepot_distant.py verifier; then
            echo "complet=oui" >> "$GITHUB_OUTPUT"
          else
            echo "complet=non" >> "$GITHUB_OUTPUT"
          fi

      - name: Sauver l'entrepot (cache, meme si une etape a echoue)
        if: always() && steps.orchestrateur.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/lake
            !data/lake/_restreint
          key: lac-v1-${{ github.run_id }}

      - name: Journal du passage (durees par etape)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journal
          path: |
            data/lake/_cache/tout/journal.json
            site/data/mise_a_jour.json
            schema_drift.md
          if-no-files-found: ignore
          retention-days: 30

      # Avant tout commit : tables, contrat strict, suite de tests complete. Une etape en echec a deja ete
      # ramenee a sa derniere version publiee par pipeline/tout.py : seules les etapes reussies changent.
      - name: Valider (Frictionless, contrat --strict, pytest)
        id: tests
        run: |
          set -euo pipefail
          frictionless validate datapackage.json
          python docs/valider_contrat.py --quiet --strict
          # garde-fou : aucun axe publie ne perd de lignes sans motif compte (pipeline/pertes_autorisees.json)
          python pipeline/garde_lignes.py
          pytest -q
          echo "resultat=ok" >> "$GITHUB_OUTPUT"

      - name: Correctif de donnees (si une donnee a change hors genere_le)
        id: correctif
        run: |
          set -euo pipefail
          if python pipeline/tout.py changements > changements.txt; then
            printf 'Fichiers modifies :\n'; cat changements.txt
            git add -- data/raw data/processed site/data docs/datapackage
            git diff --cached --binary -- data/raw data/processed site/data docs/datapackage > donnees.patch
            echo "publiable=oui" >> "$GITHUB_OUTPUT"
          else
            echo "Aucune donnee modifiee (seuls genere_le ou le rapport de passage ont change) : pas de commit."
            echo "publiable=non" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.correctif.outputs.publiable == 'oui'
        with:
          name: donnees
          path: donnees.patch
          retention-days: 7

      - name: Sortie en erreur si une etape a echoue (apres publication des etapes reussies)
        if: steps.orchestrateur.outputs.code != '0'
        run: |
          echo "::error::pipeline/tout.py : au moins une etape en echec (voir le resume et site/data/mise_a_jour.json)"
          exit 1

      - name: Sortie en erreur si la reconstruction complete est incomplete (rien n'est publie)
        if: always() && steps.complet.outputs.complet == 'non'
        run: |
          echo "::error::reconstruction complete : au moins un axe incomplet, publication bloquee (voir l'etape precedente)"
          exit 1

  publier:
    needs: produire
    # publie les etapes reussies meme si une autre a echoue, a condition que les validations soient passees
    # en reconstruction complete, seulement si tous les axes ont ete produits
    if: >-
      always() && needs.produire.outputs.tests == 'ok' && needs.produire.outputs.publiable == 'oui'
      && (github.event.inputs.reconstruction != 'true' || needs.produire.outputs.complet == 'oui')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # git push des donnees ; rien d'autre
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: donnees

      - name: Verifier le correctif (chemins de donnees seulement, aucun lien symbolique)
        run: |
          set -euo pipefail
          git apply --numstat donnees.patch | cut -f3- > chemins.txt
          if grep -vE '^(data/raw/|data/processed/|site/data/|docs/datapackage/)' chemins.txt; then
            echo "::error::le correctif touche un chemin hors donnees : refuse"; exit 1
          fi
          if git apply --summary donnees.patch | grep -E 'mode 120000|=>'; then
            echo "::error::lien symbolique ou renommage dans le correctif : refuse"; exit 1
          fi
          wc -l < chemins.txt

      - name: Committer et pousser
        run: |
          set -euo pipefail
          git apply --index donnees.patch
          rm -f donnees.patch chemins.txt
          git config user.name "data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "data: mise a jour automatique $(date -u +%Y-%m-%d)"
          # main a pu avancer pendant le passage (commits de code) : rebase sur la tete, les donnees ne
          # sont touchees que par ce workflow (concurrency: data).
          git pull --rebase --quiet origin main
          git push origin HEAD:main

  signaler:
    needs: [produire, publier]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Ouvrir ou commenter l'issue pipeline-donnees
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          body="Le pipeline de donnees a echoue : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="$body"$'\n\n'"Detail par etape : resume du job produire et artifact journal (mise_a_jour.json, journal.json, schema_drift.md si la source a change de schema)."
          existing=$(gh issue list --label pipeline-donnees --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create pipeline-donnees --color B60205 --force
            gh issue create --title "Pipeline de donnees en echec" --label pipeline-donnees --body "$body"
          fi
