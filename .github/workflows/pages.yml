name: Site (GitHub Pages)

# Construit le site (web/) avec les données de site/data, lance les tests, puis publie sur GitHub Pages.
# A activer une fois dans les réglages du dépôt : Settings > Pages > Source : GitHub Actions.
on:
  push:
    branches: [main]
  # Les commits de données faits par data.yml (GITHUB_TOKEN) ne déclenchent pas « push » : on republie après lui.
  workflow_run:
    workflows: ["Mise a jour des donnees"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Copie site/data vers web/public/data (non versionné), vérifie les types, construit dist/.
      - run: npm run build
      # 20 cas types OpenFisca, rendu des écrans, contrastes, absence d'appel réseau externe dans le bundle.
      - run: npm test
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
