name: Site (GitHub Pages)

# Construit le site (web/) avec les données de site/data, lance les tests, puis publie sur GitHub Pages.
# A activer une fois dans les réglages du dépôt : Settings > Pages > Source : GitHub Actions.
on:
  push:
    branches: [main]
  # Les commits de données faits par data.yml (GITHUB_TOKEN) ne déclenchent pas « push » : on republie après lui.
  workflow_run:
    workflows: ["Mise a jour des donnees"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Aucun droit par defaut : la construction (npm ci, code tiers) ne recoit que la lecture,
# seul le job de deploiement recoit pages: write et id-token: write.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read   # configure-pages lit la configuration Pages du depot
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Copie site/data vers web/public/data (non versionné), vérifie les types, construit dist/.
      - run: npm run build
      # 20 cas types OpenFisca, rendu des écrans, contrastes, absence d'appel réseau externe dans le bundle.
      - run: npm test
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
