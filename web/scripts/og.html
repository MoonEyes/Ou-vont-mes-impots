<!doctype html>

<html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:Fraunces;font-weight:700;src:url(../node_modules/@fontsource/fraunces/files/fraunces-latin-700-normal.woff2)}

html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#fff;color:#1d2320;font-family:Atk,sans-serif;position:relative}
.bande{position:absolute;inset:0 0 auto 0;height:14px;background:#0b5a43}
.c{position:absolute;left:80px;top:90px;right:80px}
h1{font-family:Fraunces,serif;font-size:76px;line-height:1.05;margin:0 0 28px}

p{font-size:32px;color:#4f5a54;margin:0 0 36px;max-width:900px}
.barre{display:flex;height:34px;gap:4px;margin-bottom:14px;max-width:1040px}
.barre span{display:block;height:100%;border-radius:6px}
.leg{font-size:26px;font-weight:700;display:flex;gap:28px}
.pied{position:absolute;left:0;right:0;bottom:0;height:86px;background:#f4f6f2;display:flex;align-items:center;padding:0 80px;font-size:26px;justify-content:space-between}
.pied b{font-family:Fraunces,serif;font-size:32px}
</style></head><body>
<div class="bande"></div>
<div class="c">
<h1>Où va l’argent <span class="hl">que tu paies&nbsp;?</span></h1>

<div class="barre"><span style="width:57%;background:#0b5a43"></span><span style="width:23%;background:#2e9a72"></span><span style="width:9%;background:#a07400"></span><span style="width:11%;background:#8c8577"></span></div>
<div class="leg"><span>Sécurité sociale</span><span>État</span><span>Collectivités</span><span>Non publié</span></div>
</div>
<div class="pied"><b>Où vont mes impôts</b><span>Site citoyen non officiel · données publiques ouvertes</span></div>
