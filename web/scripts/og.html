<!doctype html>
<!-- Source de public/og.png (1200 x 630) : capture par un navigateur sans interface, polices du projet. Logo : même tracé
     que le symbole #logo-billet de index.html.
     Les parts du billet sont celles de src/exemple-lyon.json (vérifié par tests/regles.test.ts). -->
<html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:'Bricolage Grotesque';font-weight:200 800;font-stretch:75% 100%;src:url(../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-opsz-normal.woff2) format('woff2-variations')}
@font-face{font-family:Figtree;font-weight:300 900;src:url(../node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2) format('woff2-variations')}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#f3f0ff;color:#1e1548;font-family:Figtree,sans-serif;position:relative}
.bandeau{position:absolute;inset:0 0 auto 0;height:48px;background:#1e1548;color:#fff;font-size:22px;display:flex;align-items:center;padding:0 72px}
.bandeau b{margin-right:8px}
.c{position:absolute;left:72px;top:92px;right:72px}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:66px;line-height:1.02;letter-spacing:-0.03em;margin:0 0 30px;max-width:1000px}
.billet{display:flex;align-items:flex-end;gap:10px;height:190px}
.billet>div{box-sizing:border-box;height:100%;border:4px solid #1e1548;border-radius:22px;box-shadow:0 7px 0 #1e1548;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:62px}
.cent{flex:0 0 120px;background:#fff;flex-direction:column;font-size:44px!important}
.cent small{font-family:Figtree,sans-serif;font-weight:600;font-size:20px}
.secu{background:#ffc93c}
.etat{background:#4f2fcc;color:#fff;height:92%!important}
.coll{background:#19c3b1;height:96%!important;font-size:40px!important}
.np{background:repeating-linear-gradient(45deg,#1e1548 0 6px,#fff 6px 16px);height:90%!important}
.np span{background:#fff;border:3px solid #1e1548;border-radius:10px;padding:0 8px;font-size:34px}
.leg{display:flex;gap:30px;font-size:24px;font-weight:700;margin-top:22px}
.pied{position:absolute;right:72px;bottom:30px;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:30px;display:flex;align-items:center;gap:14px}
.pied svg{display:block;width:69px;height:42px}
.s{fill:#ffc93c}.e{fill:#4f2fcc}.cl{fill:#19c3b1}.t{fill:none;stroke:#1e1548;stroke-width:2}.p.t{fill:#fff}.d{fill:none;stroke:#1e1548;stroke-width:2;stroke-dasharray:0 3.75;stroke-linecap:round}
</style></head><body>
<div class="bandeau"><b>Site citoyen, non officiel.</b> Il ne remplace pas impots.gouv.fr et ne juge aucune dépense.</div>
<div class="c">
<h1>Ton billet de 100&nbsp;€, découpé selon où va chaque euro.</h1>
<div class="billet">
<div class="cent">100<small>euros</small></div>
<div class="secu" data-part="57" style="flex:57 1 0">57&nbsp;€</div>
<div class="etat" data-part="23" style="flex:23 1 0">23&nbsp;€</div>
<div class="coll" data-part="9" style="flex:9 1 0">9</div>
<div class="np" data-part="11" style="flex:11 1 0"><span>11</span></div>
</div>
<div class="leg"><span>Sécurité sociale</span><span>État</span><span>Collectivités</span><span>Sans destinataire publié</span></div>
</div>
<div class="pied"><svg viewBox="0 0 46 28" aria-hidden="true"><path class="s" d="M5 4H24.8V24H5A3 3 0 0 1 2 21V7A3 3 0 0 1 5 4Z"/><rect class="e" x="24.8" y="4" width="9.2" height="20"/><path class="cl" d="M34 4H34.6A3 3 0 0 1 37.6 7V21A3 3 0 0 1 34.6 24H34Z"/><rect class="t" x="2" y="4" width="35.6" height="20" rx="3"/><path class="d" d="M24.8 6.5V21.5M34 6.5V21.5"/><rect class="p t" x="39.6" y="6.5" width="4.6" height="20" rx="2.3"/></svg>Le billet découpé</div>
</body></html>
